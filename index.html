<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comms Proofing Prototype</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9',
                        primaryHover: '#0284c7'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        .modal-content { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const IconCheck = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>;
        const IconX = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconClock = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>;
        const IconSearch = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        const IconArrowLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>;
        const IconLink = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>;
        const IconMail = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        const IconMessage = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>;
        const IconArchive = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>;
        const IconRestore = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;

        const Badge = ({ status }) => {
            let color = 'bg-gray-100 text-gray-800 border-gray-200';
            let Icon = null;
            if (status === 'Pending Approval') {
                color = 'bg-amber-50 text-amber-700 border-amber-200';
                Icon = IconClock;
            } else if (status === 'Changes Requested') {
                color = 'bg-rose-50 text-rose-700 border-rose-200';
                Icon = IconX;
            } else if (status === 'Approved') {
                color = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                Icon = IconCheck;
            }
            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${color}`}>
                    {Icon && <span className="mr-1.5 -ml-0.5"><Icon /></span>}
                    {status}
                </span>
            );
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const baseStyle = 'inline-flex justify-center items-center px-4 py-2 text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
            const variants = {
                primary: 'bg-primary text-white hover:bg-primaryHover focus:ring-primary',
                secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-500',
                danger: 'bg-rose-600 text-white hover:bg-rose-700 focus:ring-rose-500',
                ghost: 'bg-transparent text-slate-600 hover:bg-slate-100 focus:ring-slate-500'
            };
            return (
                <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const Dashboard = ({ projects, onProjectClick, onRequestProof, isArchiveView }) => {
            const [filter, setFilter] = useState('All');
            const [search, setSearch] = useState('');

            const stats = {
                pending: projects.filter(p => p.status === 'Pending Approval').length,
                changes: projects.filter(p => p.status === 'Changes Requested').length,
                approved: projects.filter(p => p.status === 'Approved').length,
            };

            const filteredProjects = projects.filter(p => {
                const matchesFilter = filter === 'All' || p.status === filter;
                const searchLower = search.toLowerCase();
                const matchesSearch = p.name.toLowerCase().includes(searchLower) || 
                                      p.recipients.some(r => r.name.toLowerCase().includes(searchLower));
                return matchesFilter && matchesSearch;
            });

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900">
                                {isArchiveView ? 'Archived Projects' : 'Proofs & Approvals'}
                            </h1>
                            <p className="text-sm text-slate-500 mt-1">
                                {isArchiveView ? 'View previously completed or cancelled projects.' : 'Manage communications projects requiring ministry review.'}
                            </p>
                        </div>
                        {!isArchiveView && (
                            <Button onClick={onRequestProof}>
                                <IconPlus /> <span className="ml-2">Request Proof</span>
                            </Button>
                        )}
                    </div>

                    {!isArchiveView && (
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-amber-300 transition-colors" onClick={() => setFilter('Pending Approval')}>
                                <div>
                                    <p className="text-sm font-medium text-slate-500">Pending Approval</p>
                                    <p className="text-3xl font-bold text-slate-900 mt-1">{stats.pending}</p>
                                </div>
                                <div className="p-3 bg-amber-50 text-amber-600 rounded-full"><IconClock /></div>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-rose-300 transition-colors" onClick={() => setFilter('Changes Requested')}>
                                <div>
                                    <p className="text-sm font-medium text-slate-500">Changes Requested</p>
                                    <p className="text-3xl font-bold text-slate-900 mt-1">{stats.changes}</p>
                                </div>
                                <div className="p-3 bg-rose-50 text-rose-600 rounded-full"><IconX /></div>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-emerald-300 transition-colors" onClick={() => setFilter('Approved')}>
                                <div>
                                    <p className="text-sm font-medium text-slate-500">Approved</p>
                                    <p className="text-3xl font-bold text-slate-900 mt-1">{stats.approved}</p>
                                </div>
                                <div className="p-3 bg-emerald-50 text-emerald-600 rounded-full"><IconCheck /></div>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-t-xl border border-slate-200 border-b-0 gap-4">
                        <div className="flex space-x-2 overflow-x-auto w-full sm:w-auto no-scrollbar">
                            {['All', 'Pending Approval', 'Changes Requested', 'Approved'].map(f => (
                                <button key={f} onClick={() => setFilter(f)}
                                    className={`px-3 py-1.5 text-sm font-medium rounded-md whitespace-nowrap transition-colors ${filter === f ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    {f}
                                </button>
                            ))}
                        </div>
                        <div className="relative w-full sm:w-64">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <IconSearch />
                            </div>
                            <input type="text" placeholder="Search projects..." value={search} onChange={e => setSearch(e.target.value)}
                                className="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
                        </div>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-b-xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Project</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Recipients</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Due Date</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-200">
                                    {filteredProjects.length === 0 ? (
                                        <tr><td colSpan="4" className="px-6 py-12 text-center text-slate-500">No projects found matching your criteria.</td></tr>
                                    ) : (
                                        filteredProjects.map(project => {
                                            const approver = project.recipients.find(r => r.role === 'Approver') || project.recipients[0];
                                            const extraCount = project.recipients.length - 1;
                                            return (
                                                <tr key={project.id} onClick={() => onProjectClick(project)} className="hover:bg-slate-50 cursor-pointer transition-colors">
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <div className="font-medium text-slate-900 flex items-center">
                                                            {project.name}
                                                            {project.isArchived && <span className="ml-2 text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded border border-slate-200">Archived</span>}
                                                        </div>
                                                        <div className="text-xs text-slate-500 mt-0.5">Version {project.versions.length}</div>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <div className="text-sm text-slate-900">{approver?.name || 'Unknown'}</div>
                                                        {extraCount > 0 && <div className="text-xs text-slate-500">+{extraCount} more</div>}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                                                        {project.dueDate}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <Badge status={project.status} />
                                                    </td>
                                                </tr>
                                            )
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectDetail = ({ project, onBack, onNewVersion, onSimulateEmail, onToggleArchive }) => {
            if (!project) return null;

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={onBack} className="flex items-center text-sm text-slate-500 hover:text-slate-800 transition-colors">
                            <IconArrowLeft /> <span className="ml-1">Back</span>
                        </button>
                        <button 
                            onClick={() => onToggleArchive(project)} 
                            className="flex items-center text-sm text-slate-500 hover:text-slate-800 transition-colors border border-slate-200 px-3 py-1.5 rounded-md bg-white shadow-sm"
                        >
                            {project.isArchived ? <><IconRestore /><span className="ml-1.5">Restore Project</span></> : <><IconArchive /><span className="ml-1.5">Archive Project</span></>}
                        </button>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
                        <div className="p-6 sm:p-8 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start gap-4">
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-2xl font-bold text-slate-900">{project.name}</h1>
                                    {project.isArchived && <span className="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-medium border border-slate-200">Archived</span>}
                                </div>
                                <div className="mt-4 flex flex-col gap-2 text-sm text-slate-600">
                                    <div className="flex items-center"><span className="font-medium mr-2 text-slate-900">Due:</span> {project.dueDate}</div>
                                    <div>
                                        <span className="font-medium mr-2 text-slate-900">Recipients:</span>
                                        <ul className="mt-1 space-y-1">
                                            {project.recipients.map((r, i) => (
                                                <li key={i} className="flex items-center text-xs">
                                                    <span className={`w-2 h-2 rounded-full mr-2 ${r.role === 'Approver' ? 'bg-primary' : 'bg-slate-300'}`}></span>
                                                    <span className="font-medium mr-1">{r.name}</span> 
                                                    <span className="text-slate-400">({r.email})</span>
                                                    <span className="ml-2 text-slate-400 italic">- {r.role}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col items-start sm:items-end gap-2 w-full sm:w-auto">
                                <Badge status={project.status} />
                                {project.status !== 'Approved' && !project.isArchived && (
                                    <button onClick={() => onSimulateEmail(project)} className="text-xs text-primary hover:underline flex items-center mt-2 border border-primary/20 bg-primary/5 px-3 py-1.5 rounded-md w-full sm:w-auto justify-center">
                                        <IconMail /> <span className="ml-1">Simulate Recipient Emails</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="bg-slate-50 p-6 sm:p-8">
                            <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-6">Version History</h3>
                            <div className="space-y-6 relative before:absolute before:inset-0 before:ml-4 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">
                                
                                {project.versions.map((version, index) => {
                                    const isLatest = index === 0;
                                    return (
                                        <div key={version.id} className="relative flex items-start justify-between md:justify-normal md:odd:flex-row-reverse group">
                                            <div className={`flex items-center justify-center w-8 h-8 rounded-full border-4 border-slate-50 bg-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 ${isLatest ? 'ring-2 ring-primary border-white' : ''}`}>
                                                <span className="text-xs font-bold text-slate-500">v{version.versionNumber}</span>
                                            </div>
                                            
                                            <div className="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-xs font-medium text-slate-500">{version.sentDate}</span>
                                                    <Badge status={version.status} />
                                                </div>
                                                
                                                {version.message && (
                                                    <p className="text-sm text-slate-700 mb-4 bg-slate-50 p-3 rounded-lg italic">
                                                        "{version.message}"
                                                    </p>
                                                )}

                                                {version.links && version.links.length > 0 && (
                                                    <div className="mb-4">
                                                        <span className="text-xs font-semibold text-slate-500 block mb-1">Attached Proofs:</span>
                                                        <div className="space-y-1">
                                                            {version.links.map((link, i) => (
                                                                <a key={i} href={link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center text-sm text-primary hover:underline break-all">
                                                                    <IconLink /> <span className="ml-1">{link}</span>
                                                                </a>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {/* Feedback Section */}
                                                {version.feedback && version.feedback.length > 0 && (
                                                    <div className="mt-4 pt-4 border-t border-slate-100 space-y-3">
                                                        <span className="text-xs font-bold text-slate-700 block mb-2 uppercase tracking-wider">Feedback Received:</span>
                                                        {version.feedback.map((fb, i) => (
                                                            <div key={i} className={`p-3 rounded-lg text-sm ${fb.type === 'approve' ? 'bg-emerald-50 border border-emerald-100' : 'bg-rose-50 border border-rose-100'}`}>
                                                                <div className="flex items-center mb-1">
                                                                    <span className="font-semibold text-slate-900 mr-1">{fb.recipientName}</span>
                                                                    <span className="text-xs text-slate-500">({fb.role})</span>
                                                                    <span className="mx-2 text-slate-300">•</span>
                                                                    <span className="text-xs text-slate-500">{fb.date}</span>
                                                                </div>
                                                                <p className={fb.type === 'approve' ? 'text-emerald-800 font-medium' : 'text-rose-900'}>{fb.text}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                        
                        {project.status === 'Changes Requested' && !project.isArchived && (
                            <div className="p-6 bg-white border-t border-slate-200 flex justify-center">
                                <Button onClick={() => onNewVersion(project)}>
                                    <IconPlus /> <span className="ml-2">Send New Version</span>
                                </Button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FormModal = ({ isOpen, onClose, title, onSubmit, children, submitText = 'Send for Approval', isSubmitting = false }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden modal-content flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-slate-900">{title}</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                        <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3">
                            <Button variant="ghost" onClick={onClose} disabled={isSubmitting}>Cancel</Button>
                            <Button onClick={onSubmit} disabled={isSubmitting}>
                                {isSubmitting ? 'Sending...' : submitText}
                            </Button>
                        </div>
                    </div>
                </div>
            );
        }

        const RequestProofModal = ({ isOpen, onClose, onSubmit, isSubmitting }) => {
            const [name, setName] = useState('');
            const [dueDate, setDueDate] = useState('');
            const [link, setLink] = useState('');
            const [message, setMessage] = useState('');
            const [recipients, setRecipients] = useState([{ id: 1, name: '', email: '', role: 'Approver' }]);
            const [error, setError] = useState('');

            const handleAddRecipient = () => {
                setRecipients([...recipients, { id: Date.now(), name: '', email: '', role: 'Reviewer' }]);
            };

            const handleRemoveRecipient = (id) => {
                if (recipients.length === 1) return;
                setRecipients(recipients.filter(r => r.id !== id));
            };

            const handleRecipientChange = (id, field, value) => {
                setRecipients(recipients.map(r => r.id === id ? { ...r, [field]: value } : r));
            };

            const handleSubmit = () => {
                setError('');
                if (!name) return setError('Project Name is required.');
                
                const approverCount = recipients.filter(r => r.role === 'Approver').length;
                if (approverCount !== 1) return setError('You must have exactly one "Final Approver".');
                
                const hasEmptyRecipients = recipients.some(r => !r.name || !r.email);
                if (hasEmptyRecipients) return setError('All recipients must have a name and email.');

                onSubmit({ name, dueDate, link, message, recipients });
                
                // Reset form
                setName(''); setDueDate(''); setLink(''); setMessage('');
                setRecipients([{ id: 1, name: '', email: '', role: 'Approver' }]);
            };

            return (
                <FormModal isOpen={isOpen} onClose={onClose} title="Request New Proof" onSubmit={handleSubmit} isSubmitting={isSubmitting}>
                    {error && <div className="mb-4 p-3 bg-rose-50 text-rose-700 text-sm rounded-md border border-rose-200">{error}</div>}
                    <div className="space-y-5">
                        <div className="grid grid-cols-3 gap-4">

                    sentDate: new Date().toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}),
                    message: data.message,
                    links: data.link ? [data.link] : [],
                    status: 'Pending Approval',
                    feedback: []
                };

                const updatedProject = {
                    ...project,
                    status: 'Pending Approval',
                    versions: [newVersion, ...project.versions]
                };

                setProjects(projects.map(p => p.id === project.id ? updatedProject : p));
                await saveToSupabase(updatedProject);
                
                // SEND REAL EMAILS
                await dispatchEmails(updatedProject);
                
                setIsSubmitting(false);
                setIsNewVersionModalOpen(false);
            };

            const handleApproverDecision = async (projectId, recipient, type, text) => {
                const project = projects.find(p => p.id === projectId);
                if (!project) return;
                
                const isApprove = type === 'approve';
                const newStatus = isApprove ? 'Approved' : 'Changes Requested';
                
                const newFeedback = {
                    recipientName: recipient.name,
                    role: recipient.role,
                    type: type,
                    text: text,
                    date: new Date().toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
                };

                const updatedVersions = [...project.versions];
                updatedVersions[0] = {
                    ...updatedVersions[0],
                    status: newStatus,
                    feedback: [...(updatedVersions[0].feedback || []), newFeedback]
                };

                const updatedProject = { ...project, status: newStatus, versions: updatedVersions };

                setProjects(projects.map(p => p.id === projectId ? updatedProject : p));
                await saveToSupabase(updatedProject);
            };

            const handleToggleArchive = async (projectToToggle) => {
                const updatedProject = { ...projectToToggle, isArchived: !projectToToggle.isArchived };
                setProjects(projects.map(p => p.id === updatedProject.id ? updatedProject : p));
                await saveToSupabase(updatedProject);
                if (view === 'detail') setView(updatedProject.isArchived ? 'archive' : 'dashboard');
            };

            return (
                <div className="min-h-screen">
                    {!isExternalUser && (view === 'dashboard' || view === 'archive' || view === 'detail') && (
                        <nav className="bg-slate-900 text-white sticky top-0 z-20 shadow-md">
                            <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
                                <div className="flex items-center space-x-2 font-bold text-lg cursor-pointer" onClick={() => setView('dashboard')}>
                                    <div className="w-6 h-6 bg-primary rounded flex items-center justify-center text-xs">IC</div>
                                    <span>Comms Proofs {dbReady && <span className="ml-2 text-[10px] bg-green-500/20 text-green-400 px-1.5 py-0.5 rounded font-normal border border-green-500/30">Live Database Connected</span>}</span>
                                </div>
                                <div className="flex items-center gap-6 text-sm font-medium">
                                    <button 
                                        onClick={() => setView('dashboard')} 
                                        className={`transition-colors ${view === 'dashboard' ? 'text-white border-b-2 border-primary py-4' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        Dashboard
                                    </button>
                                    <button 
                                        onClick={() => setView('archive')} 
                                        className={`transition-colors ${view === 'archive' ? 'text-white border-b-2 border-primary py-4' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        Archive
                                    </button>
                                </div>
                            </div>
                        </nav>
                    )}

                    {view === 'dashboard' && !isExternalUser && (
                        <Dashboard 
                            projects={projects.filter(p => !p.isArchived)} 
                            onProjectClick={p => { setActiveProjectId(p.id); setView('detail'); }} 
                            onRequestProof={() => setIsNewProjectModalOpen(true)}
                            isArchiveView={false}
                        />
                    )}

                    {view === 'archive' && !isExternalUser && (
                        <Dashboard 
                            projects={projects.filter(p => p.isArchived)} 
                            onProjectClick={p => { setActiveProjectId(p.id); setView('detail'); }} 
                            onRequestProof={() => setIsNewProjectModalOpen(true)}
                            isArchiveView={true}
                        />
                    )}

                    {view === 'detail' && !isExternalUser && (
                        <ProjectDetail 
                            project={activeProject} 
                            onBack={() => setView(activeProject?.isArchived ? 'archive' : 'dashboard')}
                            onNewVersion={() => setIsNewVersionModalOpen(true)}
                            onSimulateEmail={() => setView('email')}
                            onToggleArchive={handleToggleArchive}
                        />
                    )}

                    {view === 'email' && !isExternalUser && (
                        <ApproverEmailPreview 
                            project={activeProject}
                            onSimulateClick={(recipient) => { setActiveRecipient(recipient); setView('approver'); }}
                            onBack={() => setView('detail')}
                        />
                    )}

                    {view === 'approver' && (
                        <ApproverPortal 
                            project={activeProject}
                            recipient={activeRecipient}
                            onDecision={handleApproverDecision}
                            onBackToComms={() => setView('detail')}
                            isExternalUser={isExternalUser}
                        />
                    )}

                    <RequestProofModal 
                        isOpen={isNewProjectModalOpen} 
                        onClose={() => setIsNewProjectModalOpen(false)}
                        onSubmit={handleRequestProof}
                        isSubmitting={isSubmitting}
                    />
                    
                    <NewVersionModal 
                        isOpen={isNewVersionModalOpen}
                        onClose={() => setIsNewVersionModalOpen(false)}
                        onSubmit={handleSendNewVersion}
                        project={activeProject}
                        isSubmitting={isSubmitting}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
