<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comms Proofing Prototype</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9', // Sky blue
                        primaryHover: '#0284c7'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Simple modal animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        .modal-content { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (SVG inline for zero dependencies) ---
        const IconCheck = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>;
        const IconX = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconClock = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>;
        const IconSearch = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        const IconArrowLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>;
        const IconLink = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>;
        const IconMail = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>;

        // --- MOCK DATA ---
        const initialProjects = [
            {
                id: 'p1',
                name: 'Fall Midweek Kickoff Graphic',
                approverName: 'Katie Hurst',
                approverEmail: 'katie@ibclr.org',
                dueDate: '2026-10-15',
                status: 'Pending Approval',
                versions: [
                    {
                        id: 'v1',
                        versionNumber: 1,
                        sentDate: 'Oct 12, 10:00 AM',
                        message: 'Here is the first draft of the graphic for social media.',
                        links: ['https://ibclr.sharepoint.com/.../midweek-draft1.jpg'],
                        status: 'Pending Approval',
                        feedback: null
                    }
                ]
            },
            {
                id: 'p2',
                name: 'Student Retreat T-Shirt',
                approverName: 'Ross Spigner',
                approverEmail: 'ross@ibclr.org',
                dueDate: '2026-10-17',
                status: 'Changes Requested',
                versions: [
                    {
                        id: 'v1',
                        versionNumber: 1,
                        sentDate: 'Oct 10, 2:15 PM',
                        message: 'Front and back designs attached.',
                        links: ['retreat-shirt-design.pdf'],
                        status: 'Changes Requested',
                        feedback: 'Can we make the retreat date more prominent on the back?'
                    }
                ]
            },
            {
                id: 'p3',
                name: 'Healthy Church Sermon Series',
                approverName: 'Mark Carter',
                approverEmail: 'mark@ibclr.org',
                dueDate: '2026-10-18',
                status: 'Approved',
                versions: [
                    {
                        id: 'v1',
                        versionNumber: 1,
                        sentDate: 'Oct 8, 9:30 AM',
                        message: 'Main title slide and lower thirds.',
                        links: ['sermon-package.zip'],
                        status: 'Approved',
                        feedback: null
                    }
                ]
            },
            {
                id: 'p4',
                name: 'Christmas Concert Postcard',
                approverName: 'Andy Doonan',
                approverEmail: 'andy@ibclr.org',
                dueDate: '2026-10-24',
                status: 'Pending Approval',
                versions: [
                    {
                        id: 'v1',
                        versionNumber: 1,
                        sentDate: 'Oct 13, 11:30 AM',
                        message: 'Initial layout for the mailer. Please verify the service times.',
                        links: ['https://ibclr.sharepoint.com/.../xmas-postcard.pdf'],
                        status: 'Pending Approval',
                        feedback: null
                    }
                ]
            }
        ];

        // --- SHARED COMPONENTS ---
        const Badge = ({ status }) => {
            let color = 'bg-gray-100 text-gray-800 border-gray-200';
            let Icon = null;
            if (status === 'Pending Approval') {
                color = 'bg-amber-50 text-amber-700 border-amber-200';
                Icon = IconClock;
            } else if (status === 'Changes Requested') {
                color = 'bg-rose-50 text-rose-700 border-rose-200';
                Icon = IconX;
            } else if (status === 'Approved') {
                color = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                Icon = IconCheck;
            }
            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${color}`}>
                    {Icon && <span className="mr-1.5 -ml-0.5"><Icon /></span>}
                    {status}
                </span>
            );
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const baseStyle = 'inline-flex justify-center items-center px-4 py-2 text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2';
            const variants = {
                primary: 'bg-primary text-white hover:bg-primaryHover focus:ring-primary',
                secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-500',
                danger: 'bg-rose-600 text-white hover:bg-rose-700 focus:ring-rose-500',
                ghost: 'bg-transparent text-slate-600 hover:bg-slate-100 focus:ring-slate-500'
            };
            return (
                <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const Dashboard = ({ projects, onProjectClick, onRequestProof }) => {
            const [filter, setFilter] = useState('All');
            const [search, setSearch] = useState('');

            const stats = {
                pending: projects.filter(p => p.status === 'Pending Approval').length,
                changes: projects.filter(p => p.status === 'Changes Requested').length,
                approved: projects.filter(p => p.status === 'Approved').length,
            };

            const filteredProjects = projects.filter(p => {
                const matchesFilter = filter === 'All' || p.status === filter;
                const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.approverName.toLowerCase().includes(search.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900">Proofs & Approvals</h1>
                            <p className="text-sm text-slate-500 mt-1">Manage communications projects requiring ministry review.</p>
                        </div>
                        <Button onClick={onRequestProof}>
                            <IconPlus /> <span className="ml-2">Request Proof</span>
                        </Button>
                    </div>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-amber-300 transition-colors" onClick={() => setFilter('Pending Approval')}>
                            <div>
                                <p className="text-sm font-medium text-slate-500">Pending Approval</p>
                                <p className="text-3xl font-bold text-slate-900 mt-1">{stats.pending}</p>
                            </div>
                            <div className="p-3 bg-amber-50 text-amber-600 rounded-full"><IconClock /></div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-rose-300 transition-colors" onClick={() => setFilter('Changes Requested')}>
                            <div>
                                <p className="text-sm font-medium text-slate-500">Changes Requested</p>
                                <p className="text-3xl font-bold text-slate-900 mt-1">{stats.changes}</p>
                            </div>
                            <div className="p-3 bg-rose-50 text-rose-600 rounded-full"><IconX /></div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-emerald-300 transition-colors" onClick={() => setFilter('Approved')}>
                            <div>
                                <p className="text-sm font-medium text-slate-500">Approved</p>
                                <p className="text-3xl font-bold text-slate-900 mt-1">{stats.approved}</p>
                            </div>
                            <div className="p-3 bg-emerald-50 text-emerald-600 rounded-full"><IconCheck /></div>
                        </div>
                    </div>

                    {/* Filters & Search */}
                    <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-t-xl border border-slate-200 border-b-0 gap-4">
                        <div className="flex space-x-2 overflow-x-auto w-full sm:w-auto no-scrollbar">
                            {['All', 'Pending Approval', 'Changes Requested', 'Approved'].map(f => (
                                <button key={f} onClick={() => setFilter(f)}
                                    className={`px-3 py-1.5 text-sm font-medium rounded-md whitespace-nowrap transition-colors ${filter === f ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    {f}
                                </button>
                            ))}
                        </div>
                        <div className="relative w-full sm:w-64">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <IconSearch />
                            </div>
                            <input type="text" placeholder="Search projects..." value={search} onChange={e => setSearch(e.target.value)}
                                className="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-lg text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
                        </div>
                    </div>

                    {/* Project List */}
                    <div className="bg-white border border-slate-200 rounded-b-xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Project</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Approver</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Due Date</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-200">
                                    {filteredProjects.length === 0 ? (
                                        <tr><td colSpan="4" className="px-6 py-12 text-center text-slate-500">No projects found matching your criteria.</td></tr>
                                    ) : (
                                        filteredProjects.map(project => (
                                            <tr key={project.id} onClick={() => onProjectClick(project)} className="hover:bg-slate-50 cursor-pointer transition-colors">
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <div className="font-medium text-slate-900">{project.name}</div>
                                                    <div className="text-xs text-slate-500 mt-0.5">Version {project.versions.length}</div>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <div className="text-sm text-slate-900">{project.approverName}</div>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                                                    {project.dueDate}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <Badge status={project.status} />
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectDetail = ({ project, onBack, onNewVersion, onSimulateEmail }) => {
            if (!project) return null;

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <button onClick={onBack} className="flex items-center text-sm text-slate-500 hover:text-slate-800 mb-6 transition-colors">
                        <IconArrowLeft /> <span className="ml-1">Back to Dashboard</span>
                    </button>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
                        <div className="p-6 sm:p-8 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900">{project.name}</h1>
                                <div className="flex flex-wrap items-center gap-4 mt-2 text-sm text-slate-600">
                                    <span className="flex items-center"><span className="font-medium mr-1">Approver:</span> {project.approverName}</span>
                                    <span className="text-slate-300">|</span>
                                    <span className="flex items-center"><span className="font-medium mr-1">Due:</span> {project.dueDate}</span>
                                </div>
                            </div>
                            <div className="flex flex-col items-end gap-2">
                                <Badge status={project.status} />
                                {project.status !== 'Approved' && (
                                    <button onClick={() => onSimulateEmail(project)} className="text-xs text-primary hover:underline flex items-center mt-1">
                                        <IconMail /> <span className="ml-1">View Email Sent to Approver</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="bg-slate-50 p-6 sm:p-8">
                            <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-6">Version History</h3>
                            <div className="space-y-6 relative before:absolute before:inset-0 before:ml-4 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">
                                
                                {project.versions.slice().reverse().map((version, index) => {
                                    const isLatest = index === 0;
                                    return (
                                        <div key={version.id} className="relative flex items-start justify-between md:justify-normal md:odd:flex-row-reverse group">
                                            {/* Timeline dot */}
                                            <div className={`flex items-center justify-center w-8 h-8 rounded-full border-4 border-slate-50 bg-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 ${isLatest ? 'ring-2 ring-primary border-white' : ''}`}>
                                                <span className="text-xs font-bold text-slate-500">v{version.versionNumber}</span>
                                            </div>
                                            
                                            {/* Card */}
                                            <div className="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-xs font-medium text-slate-500">{version.sentDate}</span>
                                                    <Badge status={version.status} />
                                                </div>
                                                
                                                {version.message && (
                                                    <p className="text-sm text-slate-700 mb-4 bg-slate-50 p-3 rounded-lg italic">
                                                        "{version.message}"
                                                    </p>
                                                )}

                                                {version.links && version.links.length > 0 && (
                                                    <div className="mb-4">
                                                        <span className="text-xs font-semibold text-slate-500 block mb-1">Attached Proofs:</span>
                                                        <div className="space-y-1">
                                                            {version.links.map((link, i) => (
                                                                <a key={i} href="#" onClick={e => e.preventDefault()} className="inline-flex items-center text-sm text-primary hover:underline break-all">
                                                                    <IconLink /> <span className="ml-1">{link}</span>
                                                                </a>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {version.feedback && (
                                                    <div className="mt-4 pt-4 border-t border-rose-100 bg-rose-50 -mx-5 -mb-5 p-5 rounded-b-xl">
                                                        <span className="text-xs font-bold text-rose-800 block mb-1">Changes Requested by {project.approverName}:</span>
                                                        <p className="text-sm text-rose-900">{version.feedback}</p>
                                                    </div>
                                                )}
                                                {version.status === 'Approved' && (
                                                    <div className="mt-4 pt-4 border-t border-emerald-100 bg-emerald-50 -mx-5 -mb-5 p-5 rounded-b-xl flex items-center">
                                                        <IconCheck /> <span className="ml-2 text-sm font-medium text-emerald-800">Approved by {project.approverName}</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                        
                        {project.status === 'Changes Requested' && (
                            <div className="p-6 bg-white border-t border-slate-200 flex justify-center">
                                <Button onClick={() => onNewVersion(project)}>
                                    <IconPlus /> <span className="ml-2">Send New Version</span>
                                </Button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FormModal = ({ isOpen, onClose, title, onSubmit, children, submitText = 'Send for Approval' }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden modal-content flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-slate-900">{title}</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                        <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3">
                            <Button variant="ghost" onClick={onClose}>Cancel</Button>
                            <Button onClick={onSubmit}>{submitText}</Button>
                        </div>
                    </div>
                </div>
            );
        }

        const RequestProofModal = ({ isOpen, onClose, onSubmit }) => {
            const [formData, setFormData] = useState({ name: '', approverName: '', approverEmail: '', dueDate: '', link: '', message: '' });
            
            const handleSubmit = () => {
                if (!formData.name || !formData.approverEmail) return alert('Project Name and Approver Email are required for this prototype.');
                onSubmit(formData);
                setFormData({ name: '', approverName: '', approverEmail: '', dueDate: '', link: '', message: '' });
            };

            return (
                <FormModal isOpen={isOpen} onClose={onClose} title="Request New Proof" onSubmit={handleSubmit}>
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Project Name *</label>
                            <input type="text" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary" placeholder="e.g. VBS Postcard" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Approver Name</label>
                                <input type="text" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary" placeholder="Sarah Johnson" value={formData.approverName} onChange={e => setFormData({...formData, approverName: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Approver Email *</label>
                                <input type="email" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary" placeholder="sarah@ibclr.org" value={formData.approverEmail} onChange={e => setFormData({...formData, approverEmail: e.target.value})} />
                            </div>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
                            <input type="date" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">File / Proof Link (OneDrive, SharePoint, etc.)</label>
                            <input type="text" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary text-sm" placeholder="https://ibclr.sharepoint.com/..." value={formData.link} onChange={e => setFormData({...formData, link: e.target.value})} />
                            <p className="text-xs text-slate-500 mt-1">For this prototype, enter a mock URL or file name.</p>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Message / Context (Optional)</label>
                            <textarea rows="3" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary text-sm" placeholder="Here's the final design. Please verify dates." value={formData.message} onChange={e => setFormData({...formData, message: e.target.value})}></textarea>
                        </div>
                    </div>
                </FormModal>
            );
        };

        const NewVersionModal = ({ isOpen, onClose, onSubmit, project }) => {
            const [formData, setFormData] = useState({ link: '', message: '' });
            
            const handleSubmit = () => {
                onSubmit(formData);
                setFormData({ link: '', message: '' });
            };

            return (
                <FormModal isOpen={isOpen} onClose={onClose} title={`Send V${project?.versions.length + 1} - ${project?.name}`} onSubmit={handleSubmit}>
                    <div className="space-y-4">
                        <div className="bg-blue-50 text-blue-800 p-3 rounded-md text-sm mb-4">
                            Sending to <strong>{project?.approverName}</strong> ({project?.approverEmail}). They will receive an email with a new review link.
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">New File / Proof Link</label>
                            <input type="text" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary text-sm" placeholder="https://..." value={formData.link} onChange={e => setFormData({...formData, link: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Message describing changes</label>
                            <textarea rows="3" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-primary focus:border-primary text-sm" placeholder="I've made the dates larger as requested..." value={formData.message} onChange={e => setFormData({...formData, message: e.target.value})}></textarea>
                        </div>
                    </div>
                </FormModal>
            );
        };

        const ApproverEmailPreview = ({ project, onSimulateClick, onBack }) => {
            return (
                <div className="min-h-screen bg-gray-100 p-4 sm:p-8 flex flex-col items-center">
                    <div className="w-full max-w-2xl flex justify-between items-center mb-4">
                        <button onClick={onBack} className="text-sm font-medium text-slate-500 hover:text-slate-800 flex items-center">
                            <IconArrowLeft /> <span className="ml-1">Back to Internal App</span>
                        </button>
                        <span className="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded uppercase font-bold tracking-wider">Email Client Simulation</span>
                    </div>

                    <div className="bg-white w-full max-w-2xl rounded-xl shadow-lg overflow-hidden border border-gray-200">
                        {/* Fake email header */}
                        <div className="border-b border-gray-200 p-4 bg-gray-50 flex flex-col gap-1 text-sm">
                            <div className="flex"><span className="w-16 font-medium text-gray-500">From:</span> <span className="font-semibold">Immanuel Communications &lt;comms@ibclr.org&gt;</span></div>
                            <div className="flex"><span className="w-16 font-medium text-gray-500">To:</span> <span>{project.approverName} &lt;{project.approverEmail}&gt;</span></div>
                            <div className="flex"><span className="w-16 font-medium text-gray-500">Subject:</span> <span>Approval Requested: {project.name}</span></div>
                        </div>
                        
                        {/* Email Body */}
                        <div className="p-8 sm:p-12 text-center bg-white">
                            <div className="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white mx-auto mb-6">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Review Required</h2>
                            <p className="text-gray-600 mb-8">
                                The Communications Team has sent <strong>{project.name}</strong> for your review and approval.
                            </p>
                            
                            <div className="bg-gray-50 rounded-lg p-4 inline-block mb-8 border border-gray-100 text-left">
                                <p className="text-sm text-gray-500 uppercase tracking-wider font-semibold mb-1">Due Date</p>
                                <p className="text-lg font-medium text-gray-900">{project.dueDate}</p>
                            </div>

                            <div className="space-y-4 max-w-sm mx-auto">
                                <button onClick={onSimulateClick} className="block w-full py-3 px-4 bg-primary hover:bg-primaryHover text-white font-medium rounded-lg text-center transition-colors shadow-sm">
                                    Review Proof
                                </button>
                                <p className="text-xs text-gray-400">This link is secure and unique to you. No login required.</p>
                            </div>
                        </div>
                        <div className="bg-gray-50 p-6 text-center text-xs text-gray-500 border-t border-gray-100">
                            Questions? Reply to this email directly.<br/>
                            Immanuel Communications
                        </div>
                    </div>
                </div>
            );
        };

        const ApproverPortal = ({ project, onDecision, onBackToComms }) => {
            const [view, setView] = useState('review'); // review, reject-form, confirm-approve, success
            const [feedback, setFeedback] = useState('');
            const latestVersion = project.versions[0]; // Assuming array is ordered or we just take index 0 as latest for prototype

            const handleApprove = () => {
                onDecision(project.id, 'Approved');
                setView('success');
            };

            const handleReject = () => {
                if(!feedback) return;
                onDecision(project.id, 'Changes Requested', feedback);
                setView('success');
            };

            if (view === 'success') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center text-slate-800 modal-overlay">
                            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <IconCheck />
                            </div>
                            <h2 className="text-2xl font-bold mb-2">All Set!</h2>
                            <p className="text-slate-600 mb-8">Thanks for reviewing. The Communications team has been notified of your response.</p>
                            <button onClick={onBackToComms} className="text-sm font-medium text-primary hover:underline">
                                Return to Prototype Dashboard
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 px-4 py-4 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-primary rounded flex items-center justify-center text-white font-bold">IC</div>
                                <div>
                                    <div className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Immanuel Communications</div>
                                    <div className="font-bold text-slate-900 leading-tight">Review: {project.name}</div>
                                </div>
                            </div>
                            <div className="hidden sm:block text-sm text-slate-500">
                                Due: {project.dueDate}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto p-4 py-8 flex flex-col md:flex-row gap-8">
                        {/* Proof Area */}
                        <div className="flex-1">
                            <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200 h-[60vh] md:h-[70vh] flex flex-col items-center justify-center bg-slate-100 overflow-hidden relative">
                                {/* Simulated file preview */}
                                <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000)', backgroundSize: '20px 20px', backgroundPosition: '0 0, 10px 10px' }}></div>
                                <div className="z-10 text-center bg-white p-8 rounded-xl shadow-lg max-w-sm w-full border border-slate-200">
                                    <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                                    </div>
                                    <h3 className="font-bold text-slate-900 mb-2 truncate" title={latestVersion?.links[0] || 'Document'}>
                                        {latestVersion?.links[0] || 'Proof Document'}
                                    </h3>
                                    <p className="text-sm text-slate-500 mb-6">Preview generation simulated for prototype.</p>
                                    <a href="#" onClick={e=>e.preventDefault()} className="inline-block px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded hover:bg-slate-800 transition-colors">
                                        Open File in SharePoint
                                    </a>
                                </div>
                            </div>
                            
                            {latestVersion?.message && (
                                <div className="mt-6 bg-blue-50 border border-blue-100 p-4 rounded-lg">
                                    <p className="text-sm font-semibold text-blue-800 mb-1">Message from Communications:</p>
                                    <p className="text-sm text-blue-900 italic">"{latestVersion.message}"</p>
                                </div>
                            )}
                        </div>

                        {/* Action Panel */}
                        <div className="w-full md:w-80 shrink-0">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sticky top-24">
                                
                                {view === 'review' && (
                                    <div className="modal-overlay">
                                        <h3 className="font-bold text-slate-900 mb-4 text-lg">Make a Decision</h3>
                                        <p className="text-sm text-slate-600 mb-6">Please review the attached proof and indicate if it is ready to proceed or if changes are required.</p>
                                        <div className="space-y-3">
                                            <button onClick={() => setView('confirm-approve')} className="w-full flex items-center justify-center py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors shadow-sm text-lg">
                                                <IconCheck /> <span className="ml-2">Approve Proof</span>
                                            </button>
                                            <button onClick={() => setView('reject-form')} className="w-full flex items-center justify-center py-3 px-4 bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50 font-medium rounded-lg transition-colors">
                                                <IconX /> <span className="ml-2">Request Changes</span>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {view === 'confirm-approve' && (
                                    <div className="modal-overlay">
                                        <h3 className="font-bold text-slate-900 mb-2 text-lg">Confirm Approval</h3>
                                        <p className="text-sm text-slate-600 mb-6">You are confirming that this proof is ready to print, publish, or deliver as-is.</p>
                                        <div className="space-y-3">
                                            <button onClick={handleApprove} className="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition-colors shadow-sm">
                                                Yes, Approve
                                            </button>
                                            <button onClick={() => setView('review')} className="w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition-colors">
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {view === 'reject-form' && (
                                    <div className="modal-overlay">
                                        <h3 className="font-bold text-slate-900 mb-2 text-lg">Request Changes</h3>
                                        <p className="text-sm text-slate-600 mb-4">What needs to be updated?</p>
                                        <textarea 
                                            autoFocus
                                            rows="5" 
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary text-sm mb-4" 
                                            placeholder="Please describe what you would like changed..."
                                            value={feedback}
                                            onChange={e => setFeedback(e.target.value)}
                                        ></textarea>
                                        <div className="space-y-3">
                                            <button onClick={handleReject} disabled={!feedback.trim()} className="w-full py-3 px-4 bg-primary hover:bg-primaryHover text-white font-medium rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                                                Submit Changes
                                            </button>
                                            <button onClick={() => setView('review')} className="w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition-colors">
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                    
                    {/* Prototype Navigation helper */}
                    <div className="fixed bottom-4 left-4">
                         <button onClick={onBackToComms} className="bg-slate-900 text-white px-4 py-2 rounded-full text-xs shadow-lg hover:bg-slate-800 transition transform hover:scale-105 flex items-center">
                            <IconArrowLeft /> <span className="ml-1">Exit Approver View</span>
                        </button>
                    </div>
                </div>
            );
        }

        const App = () => {
            const [projects, setProjects] = useState(initialProjects);
            const [view, setView] = useState('dashboard'); // dashboard, detail, email, approver
            const [activeProjectId, setActiveProjectId] = useState(null);
            
            // Modals state
            const [isNewProjectModalOpen, setIsNewProjectModalOpen] = useState(false);
            const [isNewVersionModalOpen, setIsNewVersionModalOpen] = useState(false);

            const activeProject = projects.find(p => p.id === activeProjectId);

            // --- Handlers ---
            const handleRequestProof = (data) => {
                const newId = `p${Date.now()}`;
                const newProject = {
                    id: newId,
                    name: data.name,
                    approverName: data.approverName || 'Unnamed Approver',
                    approverEmail: data.approverEmail,
                    dueDate: data.dueDate || 'No Date',
                    status: 'Pending Approval',
                    versions: [
                        {
                            id: `v${Date.now()}`,
                            versionNumber: 1,
                            sentDate: 'Just now',
                            message: data.message,
                            links: data.link ? [data.link] : [],
                            status: 'Pending Approval',
                            feedback: null
                        }
                    ]
                };
                setProjects([newProject, ...projects]);
                setIsNewProjectModalOpen(false);
            };

            const handleSendNewVersion = (data) => {
                const project = activeProject;
                const newVersionNum = project.versions.length + 1;
                
                const updatedProjects = projects.map(p => {
                    if (p.id !== project.id) return p;
                    
                    const newVersion = {
                        id: `v${Date.now()}`,
                        versionNumber: newVersionNum,
                        sentDate: 'Just now',
                        message: data.message,
                        links: data.link ? [data.link] : [],
                        status: 'Pending Approval',
                        feedback: null
                    };

                    return {
                        ...p,
                        status: 'Pending Approval', // Reset status
                        versions: [newVersion, ...p.versions] // Insert at beginning
                    };
                });
                
                setProjects(updatedProjects);
                setIsNewVersionModalOpen(false);
            };

            const handleApproverDecision = (projectId, decision, feedback = null) => {
                const updatedProjects = projects.map(p => {
                    if (p.id !== projectId) return p;
                    
                    // Update latest version status and feedback
                    const updatedVersions = [...p.versions];
                    updatedVersions[0] = {
                        ...updatedVersions[0],
                        status: decision,
                        feedback: feedback
                    };

                    return {
                        ...p,
                        status: decision, // Update overall project status
                        versions: updatedVersions
                    };
                });
                
                setProjects(updatedProjects);
            };

            const openProject = (project) => {
                setActiveProjectId(project.id);
                setView('detail');
            };

            // --- Render Logic ---
            return (
                <div className="min-h-screen">
                    {/* Navigation bar for Internal Views */}
                    {(view === 'dashboard' || view === 'detail') && (
                        <nav className="bg-slate-900 text-white sticky top-0 z-20">
                            <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
                                <div className="flex items-center space-x-2 font-bold text-lg cursor-pointer" onClick={() => setView('dashboard')}>
                                    <div className="w-6 h-6 bg-primary rounded flex items-center justify-center text-xs">IC</div>
                                    <span>Comms Proofs</span>
                                </div>
                                <div className="flex items-center gap-4 text-sm font-medium">
                                    <span className="text-white">Dashboard</span>
                                    <span className="text-slate-400 hover:text-white cursor-pointer transition-colors">Archive</span>
                                    <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center border border-slate-600">JD</div>
                                </div>
                            </div>
                        </nav>
                    )}

                    {view === 'dashboard' && (
                        <Dashboard 
                            projects={projects} 
                            onProjectClick={openProject} 
                            onRequestProof={() => setIsNewProjectModalOpen(true)}
                        />
                    )}

                    {view === 'detail' && (
                        <ProjectDetail 
                            project={activeProject} 
                            onBack={() => setView('dashboard')}
                            onNewVersion={() => setIsNewVersionModalOpen(true)}
                            onSimulateEmail={() => setView('email')}
                        />
                    )}

                    {view === 'email' && (
                        <ApproverEmailPreview 
                            project={activeProject}
                            onSimulateClick={() => setView('approver')}
                            onBack={() => setView('detail')}
                        />
                    )}

                    {view === 'approver' && (
                        <ApproverPortal 
                            project={activeProject}
                            onDecision={handleApproverDecision}
                            onBackToComms={() => setView('detail')}
                        />
                    )}

                    {/* Modals rendered at app root */}
                    <RequestProofModal 
                        isOpen={isNewProjectModalOpen} 
                        onClose={() => setIsNewProjectModalOpen(false)}
                        onSubmit={handleRequestProof}
                    />
                    
                    <NewVersionModal 
                        isOpen={isNewVersionModalOpen}
                        onClose={() => setIsNewVersionModalOpen(false)}
                        onSubmit={handleSendNewVersion}
                        project={activeProject}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
